# Cloudflare Workers static assets (Vite build → dist/)
# Docs: https://developers.cloudflare.com/workers/static-assets/
#
# Dashboard / Workers Builds:
#   - Build command: yarn build
#   - Deploy uses: wrangler deploy (reads [assets] below)
#   - Environment variable (Production, then rebuild): VITE_SITE_URL=https://<your-domain>
#   - Optional: NODE_VERSION=24
#
# CLI:
#   yarn deploy

name = "piyush-priya-wedding"
compatibility_date = "2025-10-15"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
